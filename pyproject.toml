[project]
name = "revenue-agent"
version = "0.1.0"
description = "Self-improving, failure-first AR collections agent for SMBs, built on Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "mcp>=1.2,<2",
]

[project.scripts]
revenue-agent = "revenue_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revenue_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
